# Victoria Sekuritas — orkestrasi seluruh service (VPS demo / production kecil).
#
# LAYOUT FOLDER (semua repo di-clone SEJAJAR, folder ini salah satunya):
#   /opt/victoria/sekuritas-infra      ← folder ini (compose + .env)
#   /opt/victoria/sekuritas-api
#   /opt/victoria/sekuritas-ai
#   /opt/victoria/sekuritas-frontend
#   /opt/victoria/sekuritas-cms
#
# Jalankan dari folder ini:
#   cp .env.example .env   → isi domain, APP_KEY, JWT_SECRET, EKYC_AI_API_KEY, SMTP
#   docker compose up -d --build
# Panduan lengkap: DEPLOY_VPS.md

name: victoria

x-bind: &bind ${BIND_IP:-127.0.0.1}

services:
  # ---------------- Database ----------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: victoria
      POSTGRES_USER: victoria
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Backend API (Laravel) ----------------
  api:
    build: ../sekuritas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "Victoria Sekuritas API"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${PUBLIC_API_ORIGIN:-http://localhost:8080}
      # APP_KEY & JWT_SECRET WAJIB diisi di .env (kalau kosong, container
      # generate baru tiap recreate → semua token login & file terenkripsi hangus).
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: victoria
      DB_USERNAME: victoria
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      CMS_URL: ${PUBLIC_CMS_URL:-http://localhost:3001}
      # Email aktivasi akun. MAIL_MAILER=log → link aktivasi hanya ada di
      # `docker compose exec api tail storage/logs/laravel.log`.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@victoria-sekuritas.co.id}
      MAIL_FROM_NAME: "Victoria Sekuritas"
      # eKYC: fastapi = pakai service ekyc-ai di bawah; stub = tanpa AI (OCR tidak auto-isi)
      EKYC_PROVIDER: ${EKYC_PROVIDER:-fastapi}
      EKYC_FASTAPI_URL: http://ekyc-ai:8000
      EKYC_FASTAPI_KEY: ${EKYC_AI_API_KEY}
      # Inference di CPU (Nanonets OCR) bisa 30–120 dtk per foto.
      EKYC_FASTAPI_TIMEOUT: ${EKYC_FASTAPI_TIMEOUT:-180}
      EKYC_STORAGE_DISK: public
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      SINVEST_DRIVER: ${SINVEST_DRIVER:-mock}
      DUKCAPIL_DRIVER: nikparser
    volumes:
      # Upload KTP/selfie/ttd/banner tetap ada walau container di-rebuild.
      - api-storage:/var/www/html/storage/app
    ports:
      # Nginx di dalam image listen di port 80 — lihat Dockerfile sekuritas-api.
      - target: 80
        published: ${API_PORT:-8080}
        host_ip: *bind

  # ---------------- AI Service (FastAPI eKYC) ----------------
  ekyc-ai:
    build:
      context: ../sekuritas-ai
      args:
        # true = pasang engine asli (Nanonets OCR / InsightFace / Facenox). false = stub.
        WITH_MODELS: ${EKYC_WITH_MODELS:-true}
    restart: unless-stopped
    environment:
      EKYC_AI_API_KEY: ${EKYC_AI_API_KEY}
      USE_GPU: "false"
      OCR_ENGINE: ${OCR_ENGINE:-nanonets}
      FACE_MATCH_ENGINE: ${FACE_MATCH_ENGINE:-insightface}
      LIVENESS_ENGINE: ${LIVENESS_ENGINE:-facenox-onnx}
      SELFIE_KTP_ENGINE: ${SELFIE_KTP_ENGINE:-nanonets_tesseract}
      ALLOW_MODEL_DOWNLOADS: "true"
      NANONETS_PRELOAD_ON_START: ${NANONETS_PRELOAD_ON_START:-true}
      NANONETS_N_THREADS: ${NANONETS_N_THREADS:-4}
      INSIGHTFACE_MODEL_ROOT: /app/model/insightface
    volumes:
      # Isi dulu dengan: bash ../sekuritas-ai/scripts/download_models.sh (±3 GB)
      - ../sekuritas-ai/model:/app/model
    # Tidak diekspos ke host/publik — hanya dipanggil api lewat http://ekyc-ai:8000.

  # ---------------- Web depan (Nuxt → SPA statis di nginx) ----------------
  frontend:
    build:
      context: ../sekuritas-frontend
      args:
        # Di-bake saat build & dipanggil dari BROWSER user → harus URL publik.
        NUXT_PUBLIC_API_BASE: ${PUBLIC_API_ORIGIN:-http://localhost:8080}/api
    restart: unless-stopped
    ports:
      - target: 80
        published: ${WEB_PORT:-3000}
        host_ip: *bind

  # ---------------- CMS Admin (Nuxt → SPA statis via `serve`) ----------------
  cms:
    build:
      context: ../sekuritas-cms
      args:
        NUXT_PUBLIC_API_BASE: ${PUBLIC_API_ORIGIN:-http://localhost:8080}/api/cms
        NUXT_PUBLIC_FRONTEND_BASE: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - target: 3000
        published: ${CMS_PORT:-3001}
        host_ip: *bind

volumes:
  pgdata:
  api-storage:
